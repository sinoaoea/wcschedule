<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026世界杯赛程日历订阅</title>
    <style>
        body { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; background-color: #f4f4f4; color: #374151; margin: 0; padding: 20px; }
        h1 { color: #201f1c; font-size: 28px; font-weight: 700; text-align: center; margin: 40px 0 20px 0; }
        .notice-box { background-color: #ffffff; border: 1px solid #afafaf; padding: 15px 20px; border-radius: 8px; margin: 20px auto; max-width: 800px; font-size: 14px; line-height: 1.6; }
        .link-container { background-color: #FFFFFF; border-radius: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.05); max-width: 800px; margin: 20px auto; padding: 20px; }
        .subscription-item { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
        .subscription-item a { color: #737373; text-decoration: none; font-weight: 400; word-break: break-all; font-size: 13px; }
        .subscription-item a:hover { color: #d15a56; text-decoration: underline; }
        .copy-btn { background-color: #151515d9; color: #FFFFFF; border: none; padding: 6px 14px; border-radius: 6px; font-size: 14px; cursor: pointer; flex-shrink: 0; margin-left: 15px; transition: background 0.2s; }
        .copy-btn:hover { background-color: #d15a56; }
        .team-name { font-weight: 600; color: #d15a56; margin-bottom: 4px; display: flex; align-items: center; gap: 8px; }
        .subscription-item + .subscription-item { border-top: 1px solid #E5E7EB; padding-top: 16px; }
        .footer { text-align: center; margin-top: 40px; padding-top: 20px; border-top: 1px solid #E5E7EB; font-size: 14px; color: #9ca3af; }
        .footer a { color: #737373; text-decoration: none; margin: 0 10px; }
        @media (max-width: 600px) { .subscription-item { flex-direction: column; align-items: flex-start; } .copy-btn { margin-top: 8px; width: 100%; margin-left: 0; } }
    </style>
</head>
<body>
    <h1>⚽️ 2026 世界杯赛程订阅</h1>
    <div class="notice-box">
        💡 <b>订阅方法：</b>建议<b>点击“复制链接”</b>，然后在手机日历应用中选择“添加订阅日历/添加网络日历”，粘贴链接即可。这样当比分更新或赛程调整时，你的日历会自动同步。
    </div>
    <div class="link-container" id="links">
        </div>
    <div class="footer">
        <a href="https://miying.tv" target="_blank">🎬 觅影(MiyingTV)</a>
        <a href="https://sc.qing.day" target="_blank">⚽️ 苏超赛程</a>
        <p>© 2026 wcs.qing.day | 世界杯球迷社区</p>
    </div>

    <script>
        const DOMAIN = "https://wcs.qing.day";
        // 增加了国旗图标显示
        const TEAMS = [
            { p: 'all', n: '🏆 世界杯全赛程', k: '' },
            { p: 'argentina', n: '🇦🇷 阿根廷', k: '阿根廷' },
            { p: 'portugal', n: '🇵🇹 葡萄牙', k: '葡萄牙' },
            { p: 'brazil', n: '🇧🇷 巴西', k: '巴西' },
            { p: 'france', n: '🇫🇷 法国', k: '法国' },
            { p: 'england', n: '🏴󠁧󠁢󠁥󠁮󠁧󠁿 英格兰', k: '英格兰' },
            { p: 'germany', n: '🇩🇪 德国', k: '德国' },
            { p: 'spain', n: '🇪🇸 西班牙', k: '西班牙' },
            { p: 'netherlands', n: '🇳🇱 荷兰', k: '荷兰' },
            { p: 'croatia', n: '🇭🇷 克罗地亚', k: '克罗地亚' },
            { p: 'italy', n: '🇮🇹 意大利', k: '意大利' },
            { p: 'japan', n: '🇯🇵 日本', k: '日本' },
            { p: 'southkorea', n: '🇰🇷 韩国', k: '韩国' },
            { p: 'saudiarabia', n: '🇸🇦 沙特阿拉伯', k: '沙特阿拉伯' },
            { p: 'morocco', n: '🇲🇦 摩洛哥', k: '摩洛哥' },
            { p: 'usa', n: '🇺🇸 美国', k: '美国' },
            { p: 'norway', n: '🇳🇴 挪威', k: '挪威' }
        ];
        
        const container = document.getElementById('links');
        
        // 核心修复：将之前的 cities.map 改为 TEAMS.map
        container.innerHTML = TEAMS.map(c => `
            <div class="subscription-item">
                <div>
                    <span class="team-name">${c.n}</span>
                    <a href="${DOMAIN}/${c.p}" target="_blank">${DOMAIN}/${c.p}</a>
                </div>
                <button class="copy-btn" onclick="copyText('${DOMAIN}/${c.p}')">复制链接</button>
            </div>
        `).join('');

        function copyText(text) {
            // 兼容性更好的复制方法
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => {
                    alert('订阅链接已复制！\n请前往手机日历，通过“添加订阅日历”粘贴此链接。');
                });
            } else {
                // 备用方案
                const textArea = document.createElement("textarea");
                textArea.value = text;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                alert('订阅链接已复制！');
            }
        }
    </script>
</body>
</html>
